project:
  name: equity-volatility-platform-week6
  timezone: America/New_York
  day_count_basis: 365.0

universe:
  symbols: [AAPL, SPY, XSP]
  underlying_type: mixed

pricing:
  default_model: black_scholes
  default_rate: 0.04
  default_dividend_yield: 0.012
  iv: {}

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  reports: reports/generated

event_study:
  pre_event_days: 20
  post_event_days: 5
  target_dte_days: 30
  annualization_days: 252
  train_fraction: 0.60
  validation_fraction: 0.20
  minimum_walk_forward_train: 12
  ridge: 1.0e-6
  fixed_cost_bps: 8.0
  spread_cost_multiplier: 0.50
  vega_scale: 0.25
  features:
    - atm_volatility
    - skew
    - term_structure
    - volume_change
    - open_interest_change
    - iv_percentile
    - surface_dislocation
  nonlinear:
    enabled: true
    ridge: 0.01
    minimum_directional_accuracy: 0.50
    minimum_sign_stability: 0.60

strategy:
  strategy_name: event_conditioned_delta_hedged_straddle
  target_dte_days: 30
  minimum_dte_days: 7
  maximum_dte_days: 60
  entry_days_before_event: 1
  holding_period_days: 1
  hedge_frequency_days: 1
  prediction_threshold: 0.0001
  contracts_per_trade: 1
  maximum_contracts: 5
  portfolio_capital: 1000000.0
  maximum_capital_fraction_per_trade: 0.10
  short_margin_fraction: 0.20
  minimum_volume: 1
  minimum_open_interest: 100
  maximum_relative_spread: 0.35
  option_slippage_fraction_of_spread: 0.10
  commission_per_contract: 0.65
  hedge_cost_bps: 1.0
  financing_rate: 0.04
  dividend_yield: 0.012
  annualization_events: 12.0
  contract_multiplier: 100
  allow_long: true
  allow_short: true
  tradable_event_types: [cpi, fomc, earnings]

sensitivity:
  prediction_thresholds: [0.0000, 0.0008]
  holding_period_days: [1, 3, 5]
  hedge_frequency_days: [1, 2]
  option_slippage_fraction_of_spread: [0.00, 0.20]
  commission_per_contract: [0.65]
  hedge_cost_bps: [1.0, 3.0]
  minimum_open_interest: [100]
  maximum_relative_spread: [0.25, 0.35]
  year_ranges:
    - [2018, 2021]
    - [2022, 2025]
  volatility_regimes: [all, high_vol]
