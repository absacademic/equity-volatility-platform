project:
  name: equity-volatility-platform
  timezone: America/New_York
  day_count_basis: 365.0

universe:
  symbols:
    - SPY
  underlying_type: ETF

pricing:
  default_model: black_scholes
  default_rate: 0.04
  default_dividend_yield: 0.012
  iv:
    initial_volatility: 0.20
    minimum_volatility: 1.0e-8
    maximum_volatility: 10.0
    price_tolerance: 1.0e-10
    volatility_tolerance: 1.0e-10
    max_iterations: 100

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  reports: reports/generated

data:
  schema_version: "1.0.0"
  alignment:
    max_underlying_staleness_seconds: 300
  cleaning:
    max_relative_spread: 0.50
    min_volume: 1
    min_open_interest: 1
    min_moneyness: 0.50
    max_moneyness: 1.50

surface:
  spline_smoothing: 1.0e-7
  forward:
    max_pairs: 5
    maximum_atm_distance: 0.10
    reliable_relative_dispersion: 0.005
    minimum_average_quality: 0.50
  exercise_style: american
  dividends:
    use_forward_fallback: true
    exclude_early_exercise_risk: true
  arbitrage:
    price_tolerance: 1.0e-6
    variance_tolerance: 1.0e-10
    calendar_tolerance: 1.0e-6
    extrapolation_padding: 0.15
    maximum_extrapolated_iv: 3.0
    maximum_variance_multiple: 8.0
  standardized:
    extrapolation_limit: 0.15
  historical:
    annualization_days: 252
    realized_windows: [5, 20, 60]
    rolling_window: 20

event_study:
  pre_event_days: 20
  post_event_days: 5
  target_dte_days: 30
  annualization_days: 252
  train_fraction: 0.60
  validation_fraction: 0.20
  minimum_walk_forward_train: 12
  ridge: 1.0e-6
  fixed_cost_bps: 8.0
  spread_cost_multiplier: 0.50
  vega_scale: 0.25
  features:
    - atm_volatility
    - skew
    - term_structure
    - volume_change
    - open_interest_change
    - iv_percentile
    - surface_dislocation
