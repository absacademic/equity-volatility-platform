[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-volatility-platform"
version = "0.2.0"
description = "Research infrastructure for equity option pricing, implied volatility, surface features, and P&L attribution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPLv3" }
authors = [{ name = "Test" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "typer>=0.12",
    "PyYAML>=6.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
vol-platform = "vol_platform.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["vol_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/vol_platform/cli.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["vol_platform"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
